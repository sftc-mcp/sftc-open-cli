name: Release

  on:
    push:
      tags: ['v*']
    workflow_dispatch:
  
  permissions:
    contents: write

  jobs:
    release:
      runs-on: ubuntu-latest
      env:
        NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      steps:
        - uses: actions/checkout@v4

        - uses: actions/setup-node@v4
          with:
            node-version: 20
            registry-url: https://registry.npmjs.org/

        - name: 校验 tag 与 package.json 版本一致
          run: |
            PKG=$(node -p "require('./package.json').version")
            TAG=${GITHUB_REF_NAME#v}
            echo "package=$PKG tag=$TAG"
            [ "$PKG" = "$TAG" ] || { echo "::error::package.json 版本与 tag 不一致"; exit 1; }

        - name: 打 npm 包
          run: npm pack

        - name: 打技能 zip
          run: |
            mkdir -p staging/sf-intra-city-skill
            cp -r README.md SKILL.md package.json scripts staging/sf-intra-city-skill/
            (cd staging && zip -r -X ../sf-intra-city-skill.zip sf-intra-city-skill)

        - name: 生成校验值
          run: |
            shasum -a 256 sftc-open-cli-*.tgz sf-intra-city-skill.zip > checksums.txt
            cat checksums.txt
  
        - name: 创建 GitHub Release
          run: |
            gh release create "$GITHUB_REF_NAME" \
              sftc-open-cli-*.tgz \
              sf-intra-city-skill.zip \
              checksums.txt \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        - name: 发布到 npm（配了 NPM_TOKEN 才执行）
          if: env.NPM_TOKEN != ''
          run: npm publish --access public
          env:
            NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
